name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Tag of the GitHub release to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Single source of truth for both triggers (manual release event or call from release.yml).
      - name: Load release data
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isPrerelease,body > release.json
          {
            echo "tag=$TAG"
            echo "name=$(jq -r .name release.json)"
            echo "type=$(jq -r 'if .isPrerelease then "beta" else "release" end' release.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r .body release.json > changelog.md

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: kwPeYwav
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/*.jar
          name: ${{ steps.release.outputs.name }}
          version: ${{ steps.release.outputs.tag }}
          version-type: ${{ steps.release.outputs.type }}
          changelog-file: changelog.md
          loaders: neoforge
          environment: dedicated-server
          game-versions: |
            26.1.2
            26.2
            26.3
          game-version-filter: none
          java: 25
          dependencies: |
            kotlin-lang-forge(required){modrinth:kotlin-lang-forge}