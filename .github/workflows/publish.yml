name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag of the GitHub release to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Tag of the GitHub release to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Single source of truth for both triggers (manual release event or call from release.yml).
      - name: Load release data
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,isPrerelease,body > release.json
          {
            echo "tag=$TAG"
            echo "name=$(jq -r .name release.json)"
            echo "type=$(jq -r 'if .isPrerelease then "beta" else "release" end' release.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r .body release.json > changelog.md

      # Read-only and unauthenticated: a public project lists its versions without a token.
      - name: Duplicate guard
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --max-time 30 --retry 3 --retry-all-errors             --user-agent "athegreat90/autopickup release workflow"             --output versions.json --write-out '%{http_code}'             "https://api.modrinth.com/v2/project/kwPeYwav/version")" || status="000"
          case "$status" in
            200) ;;
            404)
              # Private or not yet approved: versions cannot be listed without a token.
              echo "::warning::Modrinth project is not public yet (HTTP 404); duplicate guard could not check '$TAG'."
              exit 0
              ;;
            *)
              echo "::error::Duplicate guard could not query Modrinth (HTTP $status); refusing to publish blind."
              exit 1
              ;;
          esac
          if [[ "$(jq -r --arg n "$TAG" 'any(.[]; .version_number == $n)' versions.json)" == "true" ]]; then
            echo "::error::Modrinth already has version '$TAG'."
            exit 1
          fi

      # Prefer the exact jar attached to the GitHub Release; build only when it has none
      # (e.g. a release created by hand).
      - name: Download release jar
        id: jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p build/libs
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir build/libs             && ls build/libs/*.jar > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 25
        if: steps.jar.outputs.found != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.jar.outputs.found != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Build with Gradle
        if: steps.jar.outputs.found != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: ./gradlew build "-Pmod_version=$TAG"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: kwPeYwav
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/*.jar
          name: ${{ steps.release.outputs.name }}
          version: ${{ steps.release.outputs.tag }}
          version-type: ${{ steps.release.outputs.type }}
          changelog-file: changelog.md
          loaders: neoforge
          environment: dedicated-server
          game-versions: |
            26.1.2
            26.2
            26.3
          game-version-filter: none
          java: 25
          dependencies: |
            kotlin-lang-forge(required){modrinth:kotlin-lang-forge}