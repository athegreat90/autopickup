name: Create release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'

# Least privilege: every job declares what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs first so the jar is built with the final version (the jar name contains it).
  # Nothing is committed back: the branch is protected, so the version is computed here and
  # handed to Gradle with -Pmod_version instead.
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.value }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # mod_version in gradle.properties is the base version. An unreleased base (e.g. a manual
      # minor/major bump) is released as is; otherwise the patch number after the highest
      # existing MAJOR.MINOR.* tag is used.
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if ! [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::mod_version '$base' is not strict MAJOR.MINOR.PATCH."
            exit 1
          fi
          prefix="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next="$base"
          if gh release view "$base" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || git rev-parse -q --verify "refs/tags/$base" > /dev/null; then
            latest="$patch"
            while read -r tag; do
              [[ "$tag" =~ ^${prefix//./\.}\.([0-9]+)$ ]] || continue
              (( BASH_REMATCH[1] > latest )) && latest="${BASH_REMATCH[1]}"
            done < <(git tag --list "$prefix.*")
            next="$prefix.$((latest + 1))"
          fi
          {
            echo "value=$next"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Explicit (also the action default): fail if a committed wrapper jar is not an official one.
          validate-wrappers: true

      - name: Build with Gradle
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: ./gradlew build "-Pmod_version=$VERSION"

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autopickupmod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autopickupmod-jar
          path: release-jars

      # Pushes and releases made with GITHUB_TOKEN do not trigger other workflows,
      # so the publish workflow is called directly below.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-jars/*.jar --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "$VERSION" --generate-notes

  publish:
    needs: [version, release]
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.version.outputs.tag }}
    secrets: inherit
