name: Create release

on:
  workflow_dispatch:
  push:
    branches: [26]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'

# Least privilege: every job declares what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs first so the jar is built with the final mod_version (the jar name contains it).
  version:
    if: github.ref == 'refs/heads/26'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.value }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # An unreleased mod_version (e.g. a manual minor/major bump) is released as is;
      # otherwise the patch number is bumped and committed back to the branch.
      - name: Resolve version and bump if needed
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::mod_version '$current' is not strict MAJOR.MINOR.PATCH."
            exit 1
          fi
          next="$current"
          if gh release view "$current" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || git rev-parse -q --verify "refs/tags/$current" > /dev/null; then
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            sed -i "s/^mod_version=.*/mod_version=$next/" gradle.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release $next [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          {
            echo "value=$next"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Explicit (also the action default): fail if a committed wrapper jar is not an official one.
          validate-wrappers: true

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autopickupmod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autopickupmod-jar
          path: release-jars

      # Pushes and releases made with GITHUB_TOKEN do not trigger other workflows,
      # so the publish workflow is called directly below.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" release-jars/*.jar --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "$VERSION" --generate-notes

  publish:
    needs: [version, release]
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.version.outputs.tag }}
    secrets: inherit
